name: LazyMansReminders
options:
  bundleIdPrefix: systems.edmundlim
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.54.1
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LazyMansReminders:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: Supabase
        product: Supabase
      - target: ReminderWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(PRODUCT_BUNDLE_IDENTIFIER)"
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "Lazy Man's Reminders"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - lazymansreminders
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        APP_GROUP_ID: "$(APP_GROUP_ID)"
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: App/LazyMansReminders.entitlements
      properties:
        aps-environment: "$(APNS_ENVIRONMENT)"
        com.apple.security.application-groups:
          - "$(APP_GROUP_ID)"
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
        com.apple.Push:
          enabled: 1
  ReminderWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(WIDGET_BUNDLE_IDENTIFIER)"
        SKIP_INSTALL: true
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Reminders
        APP_GROUP_ID: "$(APP_GROUP_ID)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/ReminderWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - "$(APP_GROUP_ID)"
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
