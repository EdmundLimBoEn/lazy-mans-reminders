name: LazyMansReminders
options:
  bundleIdPrefix: systems.edmundlim
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.1"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.54.1
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "11"
    VERSIONING_SYSTEM: apple-generic
    GENERATE_INFOPLIST_FILE: "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    LMR_SCHEMA_270000: LMR_REMINDERS_SCHEMA
    LMR_SCHEMA_280000: LMR_REMINDERS_SCHEMA
    LMR_SCHEMA_290000: LMR_REMINDERS_SCHEMA
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(LMR_SCHEMA_$(SDK_VERSION_MAJOR))
    "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27*]": $(inherited) LMR_REMINDERS_SCHEMA
    "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27*]": $(inherited) LMR_REMINDERS_SCHEMA
    "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos28*]": $(inherited) LMR_REMINDERS_SCHEMA
    "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator28*]": $(inherited) LMR_REMINDERS_SCHEMA
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(inherited) $(LMR_SCHEMA_$(SDK_VERSION_MAJOR))
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(LMR_SCHEMA_$(SDK_VERSION_MAJOR))
targets:
  NotepadMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Mac
        excludes:
          - PrivacyInfo.xcprivacy
      - path: App/NativeAuthCallback.swift
      - path: Shared/AppConfig.swift
      - path: Shared/Reminder.swift
      - path: Shared/ReminderStore.swift
      - path: Shared/SharedSessionStorage.swift
      - path: Shared/ReminderIntentSupport.swift
      - path: Shared/ReminderBoardLimits.swift
      - path: Shared/LockScreenLineBudget.swift
      - path: Mac/PrivacyInfo.xcprivacy
        buildPhase: resources
        type: file
    dependencies:
      - package: Supabase
        product: Supabase
    scheme:
      testTargets:
        - NotepadMacTests
    settings:
      base:
        # The existing App Store record uses the same bundle ID on both platforms.
        PRODUCT_BUNDLE_IDENTIFIER: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: NotepadMac
        TARGETED_DEVICE_FAMILY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Notepad
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - lazymansreminders
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Mac/NotepadMac.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    attributes:
      SystemCapabilities:
        com.apple.SignInWithApple:
          enabled: 1
  NotepadMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MacTests
    dependencies:
      - target: NotepadMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(PRODUCT_BUNDLE_IDENTIFIER).MacTests"
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: ""
        BUNDLE_LOADER: "$(TEST_HOST)"
  LazyMansReminders:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
        excludes:
          - PrivacyInfo.xcprivacy
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
        type: file
    dependencies:
      - package: Supabase
        product: Supabase
      - target: ReminderWidgetExtension
        embed: true
    scheme:
      testTargets:
        - LazyMansRemindersTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(PRODUCT_BUNDLE_IDENTIFIER)"
        # XcodeGen's iOS target preset overrides the project-level device family.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Minimal AppIcon-Bold"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "Notepad"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - lazymansreminders
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        SHARED_KEYCHAIN_ACCESS_GROUP: "$(AppIdentifierPrefix)$(APP_GROUP_ID)"
        APP_GROUP_ID: "$(APP_GROUP_ID)"
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        BGTaskSchedulerPermittedIdentifiers:
          - systems.edmundlim.LazyMansReminders.board-refresh
        UIBackgroundModes:
          - remote-notification
          - fetch
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/LazyMansReminders.entitlements
      properties:
        aps-environment: "$(APNS_ENVIRONMENT)"
        com.apple.developer.applesignin:
          - Default
        keychain-access-groups:
          - "$(AppIdentifierPrefix)$(APP_GROUP_ID)"
        com.apple.security.application-groups:
          - "$(APP_GROUP_ID)"
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
        com.apple.Push:
          enabled: 1
        com.apple.SignInWithApple:
          enabled: 1
  ReminderWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
        excludes:
          - PrivacyInfo.xcprivacy
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(WIDGET_BUNDLE_IDENTIFIER)"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
    info:
      path: Widget/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Reminders
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        SHARED_KEYCHAIN_ACCESS_GROUP: "$(AppIdentifierPrefix)$(APP_GROUP_ID)"
        APP_GROUP_ID: "$(APP_GROUP_ID)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/ReminderWidget.entitlements
      properties:
        keychain-access-groups:
          - "$(AppIdentifierPrefix)$(APP_GROUP_ID)"
        com.apple.security.application-groups:
          - "$(APP_GROUP_ID)"
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
  LazyMansRemindersTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LazyMansReminders
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.edmundlim.LazyMansRemindersTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
