name: LazyMansReminders
options:
  bundleIdPrefix: systems.edmundlim
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.54.1
settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "7"
    VERSIONING_SYSTEM: apple-generic
    GENERATE_INFOPLIST_FILE: "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    LMR_SCHEMA_270000: LMR_REMINDERS_SCHEMA
    LMR_SCHEMA_280000: LMR_REMINDERS_SCHEMA
    LMR_SCHEMA_290000: LMR_REMINDERS_SCHEMA
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(LMR_SCHEMA_$(SDK_VERSION_MAJOR))
    "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27*]": $(inherited) LMR_REMINDERS_SCHEMA
    "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27*]": $(inherited) LMR_REMINDERS_SCHEMA
    "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos28*]": $(inherited) LMR_REMINDERS_SCHEMA
    "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator28*]": $(inherited) LMR_REMINDERS_SCHEMA
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG $(inherited) $(LMR_SCHEMA_$(SDK_VERSION_MAJOR))
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) $(LMR_SCHEMA_$(SDK_VERSION_MAJOR))
targets:
  LazyMansReminders:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
        excludes:
          - PrivacyInfo.xcprivacy
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
        type: file
    dependencies:
      - package: Supabase
        product: Supabase
      - target: ReminderWidgetExtension
        embed: true
    scheme:
      testTargets:
        - LazyMansRemindersTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(PRODUCT_BUNDLE_IDENTIFIER)"
      configs:
        Debug:
          APNS_ENVIRONMENT: development
        Release:
          APNS_ENVIRONMENT: production
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "Lazy Man's Reminders"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - lazymansreminders
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        APP_GROUP_ID: "$(APP_GROUP_ID)"
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: true
        UIBackgroundModes:
          - remote-notification
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/LazyMansReminders.entitlements
      properties:
        aps-environment: "$(APNS_ENVIRONMENT)"
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - "$(APP_GROUP_ID)"
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
        com.apple.Push:
          enabled: 1
        com.apple.SignInWithApple:
          enabled: 1
  ReminderWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
        excludes:
          - PrivacyInfo.xcprivacy
      - path: Shared/PrivacyInfo.xcprivacy
        buildPhase: resources
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(WIDGET_BUNDLE_IDENTIFIER)"
        SKIP_INSTALL: true
    info:
      path: Widget/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Reminders
        APP_GROUP_ID: "$(APP_GROUP_ID)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/ReminderWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - "$(APP_GROUP_ID)"
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
  LazyMansRemindersTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: LazyMansReminders
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: systems.edmundlim.LazyMansRemindersTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
