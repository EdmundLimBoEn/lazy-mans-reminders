name: Web and MCP checks

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'mcp/**'
      - 'supabase/**'
      - 'scripts/**'
      - '.github/workflows/web-mcp-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-mcp-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  mcp:
    name: MCP tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  release-scripts:
    name: Release validation script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate privacy declarations when the compliance helper is present
        if: hashFiles('scripts/check_privacy_manifest.py') != ''
        run: |
          python3 scripts/check_privacy_manifest.py
          python3 scripts/check_privacy_manifest.py --self-test
      - run: python3 -B -m unittest discover -s scripts/tests -v
      - run: bash -n scripts/check-ios-toolchain.sh scripts/ios-release-build.sh scripts/ios-simulator-unit-tests.sh

  routines:
    name: Routine database and push tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - run: deno test supabase/functions/_shared supabase/functions/delete-account
      - name: Verify routines on a disposable Supabase database
        run: |
          # ECR Public sometimes rate-limits anonymous pulls; retry, then fall back to Docker Hub.
          image=public.ecr.aws/supabase/postgres:17.6.1.143
          pulled=false
          for attempt in 1 2 3; do
            if docker pull -q "$image"; then pulled=true; break; fi
            sleep $((attempt * 20))
          done
          if [ "$pulled" != true ]; then
            image=supabase/postgres:17.6.1.143
            docker pull -q "$image"
          fi
          docker run -d --name routine-tests -e POSTGRES_PASSWORD=test-only \
            "$image" \
            postgres -c shared_preload_libraries=pg_cron -c cron.database_name=postgres
          ready=false
          for attempt in $(seq 1 60); do
            if docker logs routine-tests 2>&1 | grep -q 'PostgreSQL init process complete'; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then docker logs routine-tests; exit 1; fi
          docker cp supabase routine-tests:/tmp/supabase
          for migration in \
            supabase/migrations/202608060001_create_reminders.sql \
            supabase/migrations/202608080001_completed_at_and_cleanup.sql \
            supabase/migrations/202608060002_create_device_tokens.sql \
            supabase/migrations/202608280001_live_activity_tokens.sql \
            supabase/migrations/202609260001_live_activity_handoff.sql \
            supabase/migrations/202610230001_live_activity_start_lease.sql \
            supabase/tests/live_activity_start_lease.sql \
            supabase/migrations/202610260001_device_delivery_slots.sql \
            supabase/tests/device_delivery_slots.sql \
            supabase/migrations/202608080002_lock_screen_prefs.sql \
            supabase/migrations/202608260001_agent_tokens.sql \
            supabase/migrations/20261008035839_revoke_anon_agent_token_rpcs.sql \
            supabase/migrations/20261010040000_reorder_reminders.sql \
            supabase/migrations/202610120001_routine_reminders.sql \
            supabase/migrations/202610220001_routine_ownership_and_overflow.sql \
            supabase/migrations/202610220002_reminder_text_and_token_lock.sql \
            supabase/migrations/202610220003_reminder_quotas.sql \
            supabase/migrations/202610250001_routine_owner_index.sql \
            supabase/migrations/202610280001_write_budgets.sql \
            supabase/migrations/202610280002_reminder_quota_capacity.sql \
            supabase/migrations/202610280002_preserve_pending_routine_firings.sql \
            supabase/tests/routine_owner_index.sql \
            supabase/tests/reminder_text_and_token_lock.sql \
            supabase/tests/routine_reminders.sql \
            supabase/tests/reminder_quotas.sql \
            supabase/tests/write_budgets.sql \
            supabase/migrations/202610280001_reminder_push_replay.sql \
            supabase/tests/reminder_push_replay.sql \
            supabase/migrations/202610280002_normalize_legacy_reminder_text.sql \
            supabase/tests/normalize_legacy_reminder_text.sql; do
            docker exec -i routine-tests psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -f "/tmp/$migration"
          done
      - if: always()
        run: docker rm -f routine-tests || true
