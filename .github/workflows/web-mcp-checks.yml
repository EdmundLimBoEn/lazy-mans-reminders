name: Web and MCP checks

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'mcp/**'
      - 'scripts/**'
      - '.github/workflows/web-mcp-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-mcp-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  mcp:
    name: MCP tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  release-scripts:
    name: Release validation script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate privacy declarations when the compliance helper is present
        if: hashFiles('scripts/check_privacy_manifest.py') != ''
        run: |
          python3 scripts/check_privacy_manifest.py
          python3 scripts/check_privacy_manifest.py --self-test
      - run: python3 -B -m unittest discover -s scripts/tests -v
      - run: bash -n scripts/check-ios-toolchain.sh scripts/ios-release-build.sh scripts/ios-simulator-unit-tests.sh
