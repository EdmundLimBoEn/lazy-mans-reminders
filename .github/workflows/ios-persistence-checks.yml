name: iOS persistence checks
on:
  pull_request:
    paths: ['ios/**', 'supabase/**', 'scripts/**', '.github/workflows/ios-persistence-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reorder-database:
    name: Reminder reorder database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify ordering, stale boards and account isolation
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: test-password
        run: psql -v ON_ERROR_STOP=1 -f scripts/tests/reorder-reminders.sql
  ios:
    name: iOS simulator tests
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Verify submission toolchain
        run: ./scripts/check-ios-toolchain.sh
      - run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: |
          cp Config.example.xcconfig Config.xcconfig
          xcodegen generate --spec project.yml
      - name: Run persistence unit tests
        env:
          RESULT_BUNDLE_PATH: ${{ runner.temp }}/ios-tests.xcresult
        run: ./scripts/ios-simulator-unit-tests.sh
      - name: Test result summary
        if: always()
        run: |
          if [ -d "${RUNNER_TEMP}/ios-tests.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "${RUNNER_TEMP}/ios-tests.xcresult"
          fi
      - name: Save test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/ios-tests.xcresult
  server:
    name: Server lifecycle tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/functions/_shared supabase/functions/delete-account
      - run: deno check supabase/functions/send-reminder-push/index.ts supabase/functions/delete-account/index.ts
