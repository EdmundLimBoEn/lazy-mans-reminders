name: iOS tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-tests.yml"
      - "scripts/**"

concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  sign-in-flags:
    name: Third-party sign-in flags off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if Grok or ChatGPT sign-in would ship enabled
        run: python3 scripts/check-third-party-sign-in-flags.py

  test:
    name: Simulator unit tests
    needs: sign-in-flags
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Verify submission toolchain
        run: ./scripts/check-ios-toolchain.sh

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: |
          set -euo pipefail
          cp Config.example.xcconfig Config.xcconfig
          xcodegen generate --spec project.yml

      - name: Build Release app and embedded widget for devices
        run: ./scripts/ios-release-build.sh

      - name: Save Release SDK metadata
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-sdk-metadata
          path: ${{ runner.temp }}/ios-release-metadata.json
          if-no-files-found: error

      - name: Build and test
        env:
          TEST_CONFIGURATION: Release
          RESULT_BUNDLE_PATH: ${{ runner.temp }}/ios.xcresult
        run: ./scripts/ios-simulator-unit-tests.sh

      - name: Test result summary
        if: always()
        run: |
          if [ -d "${RUNNER_TEMP}/ios.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "${RUNNER_TEMP}/ios.xcresult"
          fi

      - name: Save test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/ios.xcresult
