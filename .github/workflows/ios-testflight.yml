# Hosted TestFlight path for Lazy Man's Reminders.
# Uses macos-latest + latest-stable Xcode (never Xcode-beta). App Store Connect
# rejects Xcode 27 beta uploads; build 5 stays internal-only.
# Pin CURRENT_PROJECT_VERSION in ios/project.yml as the floor. Export sets
# manageAppVersionAndBuildNumber so App Store Connect can raise CFBundleVersion
# when that pin was already used.
#
# Jeremy: set these repository secrets before the first green upload.
# Do not commit values, .p8/.p12 files, or ios/Config.xcconfig.
#
#   ASC_KEY_ID                     App Store Connect API Key ID
#   ASC_ISSUER_ID                  App Store Connect Issuer ID
#   ASC_PRIVATE_KEY_B64            base64 of the AuthKey_*.p8 (App Store Connect API)
#   APPSTORE_CERTIFICATES_FILE_BASE64   base64 of the Apple Distribution .p12
#   APPSTORE_CERTIFICATES_PASSWORD      password for that .p12
#
# App Store Connect app id 6799138197 and team DUU8J39BA7 are public identifiers.
# The same API key is used for xcodebuild -allowProvisioningUpdates and
# `asc builds upload`.

name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-testflight.yml"

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      DEVELOPER_DIR_WAIT: "1"
      ASC_APP_ID: "6799138197"
      APPLE_TEAM_ID: "DUU8J39BA7"
      ASC_BYPASS_KEYCHAIN: "1"
      ASC_NO_UPDATE: "1"
      ASC_UPLOAD_TIMEOUT: 15m
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_B64: ${{ secrets.ASC_PRIVATE_KEY_B64 }}
      APPSTORE_CERTIFICATES_FILE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
      APPSTORE_CERTIFICATES_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require signing and App Store Connect secrets
        run: |
          set -euo pipefail
          missing=0
          for name in \
            ASC_KEY_ID \
            ASC_ISSUER_ID \
            ASC_PRIVATE_KEY_B64 \
            APPSTORE_CERTIFICATES_FILE_BASE64 \
            APPSTORE_CERTIFICATES_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret ${name}. See the comment at the top of .github/workflows/ios-testflight.yml and HUMANS.md."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Confirm Xcode is not a beta
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
          xcodebuild -showsdks
          developer_dir="$(xcode-select -p)"
          if echo "${developer_dir}" | grep -qi beta; then
            echo "::error::Selected a beta Xcode at ${developer_dir}. App Store Connect will reject the upload."
            exit 1
          fi

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Install asc
        uses: rudrankriyam/setup-asc@v1

      - name: Write Config.xcconfig
        working-directory: ios
        run: |
          set -euo pipefail
          cp Config.example.xcconfig Config.xcconfig
          sed -i '' "s/YOUR_APPLE_TEAM_ID/${APPLE_TEAM_ID}/" Config.xcconfig

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Write App Store Connect API key
        run: |
          set -euo pipefail
          key_dir="${RUNNER_TEMP}/private_keys"
          mkdir -p "${key_dir}"
          key_path="${key_dir}/AuthKey_${ASC_KEY_ID}.p8"
          python3 -c 'import base64,os,pathlib,sys; pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ["ASC_PRIVATE_KEY_B64"]))' "${key_path}"
          chmod 600 "${key_path}"
          echo "APP_STORE_CONNECT_API_KEY_PATH=${key_path}" >> "${GITHUB_ENV}"

      - name: Resolve packages
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project LazyMansReminders.xcodeproj \
            -scheme LazyMansReminders

      - name: Archive Release
        working-directory: ios
        run: |
          set -euo pipefail
          archive_path="${RUNNER_TEMP}/LazyMansReminders.xcarchive"
          echo "ARCHIVE_PATH=${archive_path}" >> "${GITHUB_ENV}"
          xcodebuild archive \
            -project LazyMansReminders.xcodeproj \
            -scheme LazyMansReminders \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${archive_path}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${APP_STORE_CONNECT_API_KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="${APPLE_TEAM_ID}"

      - name: Export IPA for App Store Connect
        run: |
          set -euo pipefail
          export_path="${RUNNER_TEMP}/ipa"
          options_path="${RUNNER_TEMP}/ExportOptions.plist"
          mkdir -p "${export_path}"
          cat > "${options_path}" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>uploadSymbols</key>
            <true/>
            <key>manageAppVersionAndBuildNumber</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "${ARCHIVE_PATH}" \
            -exportPath "${export_path}" \
            -exportOptionsPlist "${options_path}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${APP_STORE_CONNECT_API_KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"
          ipa_path="$(find "${export_path}" -name '*.ipa' -print -quit)"
          if [ -z "${ipa_path}" ]; then
            echo "::error::Export succeeded but no IPA was produced."
            ls -la "${export_path}"
            exit 1
          fi
          echo "IPA_PATH=${ipa_path}" >> "${GITHUB_ENV}"
          echo "Exported ${ipa_path}"

      - name: Upload build to App Store Connect
        run: |
          set -euo pipefail
          asc builds upload --app "${ASC_APP_ID}" --ipa "${IPA_PATH}"
