<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notepad</title>
<!-- Copy below is verbatim from the sillyapps.co Notepad entry. Text marked "Placeholder:" is temporary; replace it when final copy is ready. -->
<meta name="description" content="Reminders that live on your Lock Screen.">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#fafafa;--fg:#0a0a0a;--muted:#71717a;--border:#e4e4e7;--btn:#18181b;--btnfg:#fafafa}
@media (prefers-color-scheme:dark){:root{--bg:#0a0a0a;--fg:#fafafa;--muted:#a1a1aa;--border:#27272a;--btn:#fafafa;--btnfg:#18181b}}
:root[data-theme=light]{--bg:#fafafa;--fg:#0a0a0a;--muted:#71717a;--border:#e4e4e7;--btn:#18181b;--btnfg:#fafafa}
:root[data-theme=dark]{--bg:#0a0a0a;--fg:#fafafa;--muted:#a1a1aa;--border:#27272a;--btn:#fafafa;--btnfg:#18181b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Inter,sans-serif;-webkit-font-smoothing:antialiased}
header,footer{max-width:960px;width:100%;margin:0 auto;padding:20px 24px;display:flex;align-items:center;justify-content:space-between}
header a.brand{display:flex;gap:10px;align-items:center;color:inherit;text-decoration:none;font-weight:600}
header img{width:28px;height:28px;border-radius:7px}
main{flex:1;max-width:640px;margin:0 auto;padding:72px 24px;text-align:center}
main img{width:96px;height:96px;border-radius:22px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
h1{font-size:44px;line-height:1.1;letter-spacing:-.03em;margin:28px 0 12px}
p.lead{font-size:18px;color:var(--muted);margin:0 auto 32px;max-width:520px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;height:40px;padding:0 18px;border-radius:8px;font-size:14px;font-weight:500;text-decoration:none;border:1px solid var(--border);color:var(--fg)}
.btn.primary{background:var(--btn);color:var(--btnfg);border-color:var(--btn)}
.tags{margin-top:28px;display:flex;gap:8px;justify-content:center;color:var(--muted);font-size:13px}
.tags span{border:1px solid var(--border);border-radius:999px;padding:2px 10px}
footer{border-top:1px solid var(--border);color:var(--muted);font-size:13px}
footer a{color:inherit}
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><img src="/icon.png" alt="">Notepad</a>
  <a class="btn" href="https://app.notepads.dev">Open app</a>
</header>
<main>
  <img src="/icon.png" alt="Notepad icon">
  <h1>Reminders that live on your Lock Screen.</h1>
  <p class="lead">Live Activities keep today's list in view, so you never open another list app. Calm, useful, and a little cheeky.</p>
  <div class="actions">
    <a class="btn primary" href="https://app.notepads.dev">Open app</a>
    <!-- Placeholder: app is not on the App Store yet. Swap for the App Store link and label at launch. -->
    <span class="btn" aria-disabled="true">Placeholder: Coming soon to the App Store</span>
  </div>
  <div class="tags"><span>iOS</span><span>Web</span><span>Free</span></div>
</main>
<footer>
  <span>Placeholder: Notepad by Silly Apps.</span>
  <a href="https://sillyapps.co">sillyapps.co</a>
</footer>
</body>
</html>
